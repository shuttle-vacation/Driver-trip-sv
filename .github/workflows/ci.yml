name: Driver Trip CI
on:
  push:
    branches: ['feature/**', main]
  pull_request:
    branches: [main]
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check assets/app.js && node --check assets/config.js
      - name: Verify app entry points
        run: test -s index.html && test -s assets/styles.css && test -s README.md
